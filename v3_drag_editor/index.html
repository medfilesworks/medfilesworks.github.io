<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root { font-family: system-ui, sans-serif; color: #1e293b; }
  body { margin: 0; background: transparent; }
  .hint { padding: 4px 2px 12px; font-size: 13px; }
  .stage { position: relative; margin: auto; width: 100%; max-width: 680px;
           border: 1px solid #94a3b8; border-radius: 8px;
           overflow: hidden; background: #fff; user-select: none; }
  .page { display: block; width: 100%; height: auto; pointer-events: none; }
  .mark { position: absolute; display: block; height: auto; cursor: grab;
          touch-action: none; user-select: none; border: 1px dashed #2563eb;
          box-sizing: border-box; }
  .mark:active { cursor: grabbing; }
  .foot { text-align: center; font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>
<div class="hint">حرّكي العلامة الزرقاء بالماوس أو اللمس. ستُحفظ إحداثياتها عند الإفلات.</div>
<div class="stage" id="stage">
  <img class="page" id="page" draggable="false"/>
  <img class="mark" id="mark" draggable="false" aria-label="اسحبي العلامة المائية"/>
</div>
<div class="foot" id="coordinates"></div>
<script>
(function() {
  const stage = document.getElementById('stage');
  const page = document.getElementById('page');
  const mark = document.getElementById('mark');
  const coordinates = document.getElementById('coordinates');
  let x = 0.5, y = 0.5, dragging = false, dx = 0, dy = 0;
  function notify(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, extra || {}), '*');
  }
  function setHeight() { notify('streamlit:setFrameHeight', {height:Math.ceil(document.body.scrollHeight) + 6}); }
  function clamp(n) { return Math.min(1,Math.max(0,n)); }
  function place() {
    const availX = Math.max(0,stage.clientWidth-mark.offsetWidth);
    const availY = Math.max(0,stage.clientHeight-mark.offsetHeight);
    mark.style.left = Math.round(x*availX)+'px';
    mark.style.top = Math.round(y*availY)+'px';
    coordinates.textContent='الموضع: أفقي '+Math.round(x*100)+'% · عمودي '+Math.round(y*100)+'%';
    setHeight();
  }
  function fromPointer(event) {
    const rect=stage.getBoundingClientRect();
    const availX=Math.max(0,stage.clientWidth-mark.offsetWidth);
    const availY=Math.max(0,stage.clientHeight-mark.offsetHeight);
    x=availX ? clamp((event.clientX-rect.left-dx)/availX) : 0.5;
    y=availY ? clamp((event.clientY-rect.top-dy)/availY) : 0.5;
    place();
  }
  mark.addEventListener('pointerdown', e=>{
    e.preventDefault(); dragging=true;
    const rect=mark.getBoundingClientRect();
    dx=e.clientX-rect.left; dy=e.clientY-rect.top;
    mark.setPointerCapture(e.pointerId);
  });
  mark.addEventListener('pointermove', e=>{if (dragging) {e.preventDefault();fromPointer(e);}});
  function release(e) {
    if (!dragging) return;
    dragging=false; fromPointer(e);
    notify('streamlit:setComponentValue', {value:{x:+x.toFixed(5), y:+y.toFixed(5)}});
  }
  mark.addEventListener('pointerup', release);
  mark.addEventListener('pointercancel', release);
  window.addEventListener('resize', place);
  window.addEventListener('message', e=>{
    if (e.data.type !== 'streamlit:render') return;
    const args=e.data.args||{};
    x=clamp(Number(args.x ?? .5)); y=clamp(Number(args.y ?? .5));
    page.onload=()=>{place();setHeight();};
    mark.onload=()=>{mark.style.width=((Number(args.stamp_width)/Number(args.page_width))*100)+'%';place();};
    page.src='data:image/png;base64,'+args.page_png_b64;
    mark.src='data:image/png;base64,'+args.mark_png_b64;
    mark.style.width=((Number(args.stamp_width)/Number(args.page_width))*100)+'%';
    place();
  });
  notify('streamlit:componentReady', {apiVersion:1});
  setHeight();
})();
</script>
</body>
</html>
